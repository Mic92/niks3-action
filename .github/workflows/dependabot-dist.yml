# Dependabot bumps package*.json but can't run `npm run build`, so dist/
# would always be stale. Regenerate and push to the PR branch so the
# dist-fresh check passes and auto-merge can land it.
#
# pull_request_target gives write access. Don't run lifecycle scripts from
# the bumped packages (--ignore-scripts) so a malicious release can't
# exfiltrate the token. esbuild's postinstall just downloads its binary,
# which `npm rebuild esbuild` does without running arbitrary code paths
# beyond npm itself.
name: Dependabot dist
on: pull_request_target
permissions:
  contents: write
jobs:
  rebuild-dist:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild # fetch the platform binary skipped by --ignore-scripts
      - run: npm run build
      - run: |
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "Rebuild dist"
            git push
          fi
