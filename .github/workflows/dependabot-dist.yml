# Dependabot bumps package*.json but can't run `npm run build`, so dist/
# would always be stale. Regenerate and push to the PR branch so the
# dist-fresh check passes and auto-merge can land it.
#
# pull_request_target gives write access. Don't run lifecycle scripts from
# the bumped packages (--ignore-scripts) so a malicious release can't
# exfiltrate the token. esbuild's postinstall just downloads its binary,
# which `npm rebuild esbuild` does without running arbitrary code paths
# beyond npm itself.
name: Dependabot dist
on: pull_request_target
permissions:
  contents: read
jobs:
  rebuild-dist:
    # Match the PR author, not github.actor — the latter is whoever
    # triggered the event (e.g. a maintainer reopening the PR).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-slim
    steps:
      # Push with an App token instead of GITHUB_TOKEN so the new commit
      # actually triggers the required CI/Test workflows; GitHub suppresses
      # workflow_run for GITHUB_TOKEN pushes to prevent recursion.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild # fetch the platform binary skipped by --ignore-scripts
      - run: npm run build
      - run: |
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "Rebuild dist"
            git push
          fi
