name: niks3 binary cache
description: Push Nix build outputs to a niks3 binary cache with per-derivation caching
author: Mic92
branding:
  icon: database
  color: blue
inputs:
  server-url:
    description: >-
      niks3 server URL (e.g. https://niks3.example.com). The action fetches substituter URL, public keys, and OIDC audience from this server's /api/cache-config endpoint unless overridden below.
    required: true
  substituter:
    description: >-
      Override the substituter URL written to nix.conf. Defaults to the server's configured cache-url.
    required: false
  skip-push:
    description: >-
      Only configure the substituter; do not push build outputs.
    default: 'false'
  niks3-bin:
    description: >-
      Path to a niks3 binary. Defaults to downloading the pinned niks3 release.
    required: false
  cache-config-timeout:
    description: >-
      Seconds to wait for each /api/cache-config request before timing out.
    default: '15'
  cache-config-retries:
    description: >-
      Number of additional attempts to fetch /api/cache-config after a transient failure (network error, timeout, or 5xx).
    default: '3'
  drain-timeout:
    description: >-
      Seconds to wait for the upload daemon to drain in the post step.
    default: '600'
  debug:
    description: >-
      Enable debug logging.
    default: 'false'
outputs:
  binary-dir:
    description: Directory containing the niks3 and niks3-hook binaries.
  auth-token-script:
    description: Script printing a fresh OIDC token, for `niks3 --auth-token-script` (daemon mode only).
  socket:
    description: Unix socket the niks3-hook serve daemon listens on (daemon mode only).
runs:
  using: node24
  main: dist/index.cjs
  post: dist/index.cjs
